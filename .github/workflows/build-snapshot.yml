# 手动构建 OpenPrinting/cups master 快照（pin commit，无 overlay）
name: Build CUPS Snapshot

on:
  workflow_dispatch:
    inputs:
      cups_commit:
        description: OpenPrinting/cups commit SHA（含 #1535 的 master 快照）
        required: false
        default: a18775b193e9a4a24e22e7ceead05d2e2cd16b51
      create_release:
        description: Publish GitHub Release (prerelease) after successful build
        required: false
        default: true
        type: boolean

jobs:
  prepare:
    name: Configure snapshot
    runs-on: ubuntu-latest
    outputs:
      pkg_version: ${{ steps.meta.outputs.pkg_version }}
      version_detail: ${{ steps.meta.outputs.version_detail }}
      commit_short: ${{ steps.meta.outputs.commit_short }}
      commit_full: ${{ steps.meta.outputs.commit_full }}
    steps:
      - name: Resolve snapshot metadata
        id: meta
        env:
          COMMIT: ${{ inputs.cups_commit }}
        run: |
          COMMIT="${COMMIT#v}"
          [ "${#COMMIT}" -ge 7 ] || { echo "Invalid commit SHA: $COMMIT"; exit 1; }
          SHORT="${COMMIT:0:7}"
          DATE=$(date -u +%Y%m%d)
          PKG_VERSION="2.5.0"
          VERSION_DETAIL="2.5.0~snapshot.${DATE}.${SHORT}"
          echo "Snapshot commit: ${COMMIT}"
          echo "PKG_VERSION (ipk): ${PKG_VERSION}"
          echo "VERSION_DETAIL: ${VERSION_DETAIL}"
          echo "pkg_version=${PKG_VERSION}" >> $GITHUB_OUTPUT
          echo "version_detail=${VERSION_DETAIL}" >> $GITHUB_OUTPUT
          echo "commit_short=${SHORT}" >> $GITHUB_OUTPUT
          echo "commit_full=${COMMIT}" >> $GITHUB_OUTPUT

  build:
    name: ${{ matrix.target }}/${{ matrix.subtarget }} snapshot
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86
            subtarget: "64"
          - arch: aarch64_cortex-a72
            target: mvebu
            subtarget: cortexa72
          - arch: aarch64_generic
            target: rockchip
            subtarget: armv8
          - arch: aarch64_cortex-a53_filogic
            target: mediatek
            subtarget: filogic
          - arch: mips_24kc
            target: malta
            subtarget: be
          - arch: mipsel_24kc
            target: ramips
            subtarget: mt7621
          - arch: mipsel_24kc_mt7620
            target: ramips
            subtarget: mt7620
          - arch: mipsel_24kc_rt305x
            target: ramips
            subtarget: rt305x
          - arch: mips_24kc_ath79
            target: ath79
            subtarget: generic
          - arch: mips_24kc_ath79_tiny
            target: ath79
            subtarget: tiny
          - arch: arm_cortex-a7_neon-vfpv4
            target: sunxi
            subtarget: cortexa7
          - arch: arm_cortex-a9
            target: mvebu
            subtarget: cortexa9
          - arch: powerpc_8548
            target: mpc85xx
            subtarget: p1020
          - arch: stm32-stm32mp1
            target: stm32
            subtarget: stm32mp1
          - arch: lantiq-xrx200_legacy
            target: lantiq
            subtarget: xrx200

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read OpenWrt version
        run: echo "OPENWRT_VERSION=$(tr -d ' \n' < .github/openwrt-version)" >> $GITHUB_ENV

      - name: Write snapshot.mk
        run: |
          printf 'CUPS_SNAPSHOT_COMMIT:=%s\nCUPS_SNAPSHOT_VERSION:=%s\n' \
            "${{ needs.prepare.outputs.commit_full }}" \
            "${{ needs.prepare.outputs.pkg_version }}" \
            > packages/print/cups/snapshot.mk
          cat packages/print/cups/snapshot.mk

      - name: Download and extract SDK
        id: sdk
        env:
          TARGET: ${{ matrix.target }}
          SUBTARGET: ${{ matrix.subtarget }}
        run: |
          BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets"
          TARGET_PATH="${TARGET}/${SUBTARGET}"
          INDEX=$(curl -sL "${BASE_URL}/${TARGET_PATH}/")
          SDK_FILE=$(echo "$INDEX" | grep -oE "openwrt-sdk-${OPENWRT_VERSION}-${TARGET}-${SUBTARGET}_[^\"]+\.tar\.zst" | head -1)
          [ -n "$SDK_FILE" ] || { echo "ERROR: Could not find SDK for ${TARGET_PATH}"; exit 1; }
          SDK_WORK="${RUNNER_TEMP}/openwrt-sdk-${TARGET}-${SUBTARGET}"
          mkdir -p "$SDK_WORK"
          cd "$SDK_WORK"
          curl -sL -o sdk.tar.zst "${BASE_URL}/${TARGET_PATH}/${SDK_FILE}"
          tar -I zstd -xf sdk.tar.zst
          rm sdk.tar.zst
          SDK_DIR=$(find "$SDK_WORK" -mindepth 1 -maxdepth 1 -type d -name "openwrt-sdk-*" | head -1)
          [ -n "$SDK_DIR" ] || { echo "ERROR: SDK directory not found under ${SDK_WORK}"; exit 1; }
          echo "dir=${SDK_DIR}" >> $GITHUB_OUTPUT

      - name: Configure feed
        env:
          FEED_DIR: ${{ github.workspace }}
        run: |
          cd "${{ steps.sdk.outputs.dir }}"
          [ -f feeds.conf ] || cp feeds.conf.default feeds.conf
          echo "src-link openprinting_cups $FEED_DIR" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -p openprinting_cups -f cups
          make defconfig 2>/dev/null || true

      - name: Build CUPS snapshot packages
        run: |
          cd "${{ steps.sdk.outputs.dir }}"
          make package/cups/compile -j$(nproc) V=s

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: cups-snapshot-${{ matrix.arch }}-packages
          path: ${{ steps.sdk.outputs.dir }}/bin/**/cups*.ipk
          if-no-files-found: warn

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cups-snapshot-${{ matrix.arch }}-logs
          path: ${{ steps.sdk.outputs.dir }}/logs/
          if-no-files-found: ignore

  release:
    name: Publish snapshot Release
    needs: [prepare, build]
    if: inputs.create_release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read OpenWrt version
        id: openwrt
        run: echo "version=$(tr -d ' \n' < .github/openwrt-version)" >> $GITHUB_OUTPUT

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: cups-snapshot-*-packages
          merge-multiple: true
          path: dist

      - name: Flatten snapshot package filenames
        run: |
          # cups-bsd_2.5.0~snapshot.20260626.a18775b-r1_aarch64.ipk → cups-bsd_2.5.0_aarch64.ipk
          find dist -name 'cups*.ipk' -print0 | while IFS= read -r -d '' f; do
            b=$(basename "$f")
            new=$(echo "$b" | sed -E 's/(cups-[a-z]+_)2\.5\.0(~snapshot\.[0-9]+\.[a-f0-9]+)?-r[0-9]+/\12.5.0/')
            if [ "$b" != "$new" ]; then
              mv "$f" "$(dirname "$f")/$new"
            fi
          done
          echo "Release assets:"
          find dist -name 'cups*.ipk' | sort | head -10

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot-${{ needs.prepare.outputs.commit_short }}-openwrt-${{ steps.openwrt.outputs.version }}
          name: CUPS snapshot ${{ needs.prepare.outputs.commit_short }} (OpenWrt ${{ steps.openwrt.outputs.version }})
          body: |
            OpenPrinting/cups master 快照构建。

            - **Commit:** `${{ inputs.cups_commit }}`
            - **Build ID:** `${{ needs.prepare.outputs.version_detail }}`
            - **Release 文件名:** `cups-*_2.5.0_<arch>.ipk`
            - **说明:** 2.5 开发线，含上游 #1535 中文 Web UI，无 overlay；预发布，仅供测试。
          draft: false
          prerelease: true
          files: |
            dist/**/*.ipk
