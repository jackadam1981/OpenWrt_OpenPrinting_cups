# 定时检查 OpenPrinting/cups 与 OpenWrt 新版本，更新后推送并触发构建
# 每天 UTC 0:00 运行
name: Check for CUPS and OpenWrt Updates

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-check:
    name: Check upstream releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for updates
        id: update
        run: |
          set -euo pipefail

          MAKEFILE="packages/print/cups/Makefile"
          OPENWRT_FILE=".github/openwrt-version"

          cups_updated=false
          openwrt_updated=false
          changed=false

          # --- CUPS stable version (skip snapshot Makefile branch) ---
          current_cups=$(grep -E '^PKG_VERSION:=[0-9]' "$MAKEFILE" | head -1 | cut -d= -f2- | tr -d ' ')
          echo "Current CUPS: ${current_cups}"

          api_resp=$(curl -sL "https://api.github.com/repos/OpenPrinting/cups/releases/latest")
          new_tag=$(echo "$api_resp" | jq -r '.tag_name // empty')
          [ -n "$new_tag" ] || { echo "Failed to fetch latest CUPS release"; exit 1; }
          latest_cups="${new_tag#v}"
          echo "Latest CUPS: ${latest_cups}"

          if [ "$current_cups" != "$latest_cups" ] && \
             [ "$(printf '%s\n' "$current_cups" "$latest_cups" | sort -V | tail -n1)" = "$latest_cups" ]; then
            tarball_url="https://github.com/OpenPrinting/cups/releases/download/v${latest_cups}/cups-${latest_cups}-source.tar.gz"
            echo "Downloading ${tarball_url} to compute hash..."
            new_hash=$(curl -sfL "$tarball_url" | sha256sum | cut -d' ' -f1)
            echo "New CUPS SHA256: ${new_hash}"

            sed -i "s/^PKG_VERSION:=[0-9][0-9.]*\$/PKG_VERSION:=${latest_cups}/" "$MAKEFILE"
            sed -i "s/^PKG_HASH:=.*/PKG_HASH:=${new_hash}/" "$MAKEFILE"
            sed -i '/^# TODO: 更新为对应版本 tarball 的真实 SHA256$/d' "$MAKEFILE"

            cups_updated=true
            changed=true
            echo "CUPS updated: ${current_cups} → ${latest_cups}"
          else
            echo "CUPS already at latest (${current_cups})"
          fi

          # --- OpenWrt stable release (SDK must exist) ---
          current_openwrt=$(tr -d ' \n' < "$OPENWRT_FILE")
          echo "Current OpenWrt: ${current_openwrt}"

          releases_html=$(curl -sfL "https://downloads.openwrt.org/releases/")
          mapfile -t openwrt_versions < <(
            echo "$releases_html" | grep -oE 'href="[0-9]{2}\.[0-9]+\.[0-9]+/"' | sed -E 's|href="([0-9]{2}\.[0-9]+\.[0-9]+)/"|\1|' | sort -Vu
          )
          [ "${#openwrt_versions[@]}" -gt 0 ] || { echo "Failed to list OpenWrt releases"; exit 1; }

          latest_openwrt=""
          for (( idx=${#openwrt_versions[@]}-1; idx>=0; idx-- )); do
            candidate="${openwrt_versions[$idx]}"
            sdk_index=$(curl -sfL "https://downloads.openwrt.org/releases/${candidate}/targets/x86/64/" || true)
            if echo "$sdk_index" | grep -q "openwrt-sdk-${candidate}-x86-64"; then
              latest_openwrt="$candidate"
              break
            fi
            echo "OpenWrt ${candidate} listed but x86/64 SDK not ready, skipping"
          done
          [ -n "$latest_openwrt" ] || { echo "No OpenWrt release with available SDK found"; exit 1; }
          echo "Latest OpenWrt (SDK verified): ${latest_openwrt}"

          if [ "$current_openwrt" != "$latest_openwrt" ] && \
             [ "$(printf '%s\n' "$current_openwrt" "$latest_openwrt" | sort -V | tail -n1)" = "$latest_openwrt" ]; then
            echo "$latest_openwrt" > "$OPENWRT_FILE"
            openwrt_updated=true
            changed=true
            echo "OpenWrt updated: ${current_openwrt} → ${latest_openwrt}"
          else
            echo "OpenWrt already at latest (${current_openwrt})"
          fi

          echo "changed=${changed}" >> $GITHUB_OUTPUT
          echo "cups_updated=${cups_updated}" >> $GITHUB_OUTPUT
          echo "openwrt_updated=${openwrt_updated}" >> $GITHUB_OUTPUT
          echo "cups_old=${current_cups}" >> $GITHUB_OUTPUT
          echo "cups_new=${latest_cups}" >> $GITHUB_OUTPUT
          echo "openwrt_old=${current_openwrt}" >> $GITHUB_OUTPUT
          echo "openwrt_new=${latest_openwrt}" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add packages/print/cups/Makefile .github/openwrt-version

          subject="chore: bump"
          body=""
          if [ "${{ steps.update.outputs.cups_updated }}" = "true" ]; then
            subject="${subject} CUPS to ${{ steps.update.outputs.cups_new }}"
            body="${body}
          - CUPS: ${{ steps.update.outputs.cups_old }} → ${{ steps.update.outputs.cups_new }}"
          fi
          if [ "${{ steps.update.outputs.openwrt_updated }}" = "true" ]; then
            if [ "${{ steps.update.outputs.cups_updated }}" = "true" ]; then
              subject="${subject}, OpenWrt to ${{ steps.update.outputs.openwrt_new }}"
            else
              subject="${subject} OpenWrt to ${{ steps.update.outputs.openwrt_new }}"
            fi
            body="${body}
          - OpenWrt SDK: ${{ steps.update.outputs.openwrt_old }} → ${{ steps.update.outputs.openwrt_new }}"
          fi

          git commit -m "${subject}${body}"

          git push origin HEAD:master

      - name: Trigger build and release
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches" \
            -d '{"ref":"master","inputs":{"create_release":"true"}}'
          echo "Triggered Build CUPS for OpenWrt (create_release=true)"
